name: CI

on:
  pull_request:
    branches: [v2, main]
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out browser-control
        uses: actions/checkout@v4
        with:
          path: browser-control

      # @agent-software/core resolves as file:../agent-software/core, a private sibling repo.
      # AGENT_SOFTWARE_TOKEN is a fine-grained token with read-only Contents on TheSethRose/agent-software.
      - name: Check agent-software token
        env:
          TOKEN: ${{ secrets.AGENT_SOFTWARE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret AGENT_SOFTWARE_TOKEN is not set. Add a fine-grained, read-only (Contents) token for TheSethRose/agent-software."
            exit 1
          fi

      - name: Check out agent-software
        uses: actions/checkout@v4
        with:
          repository: TheSethRose/agent-software
          token: ${{ secrets.AGENT_SOFTWARE_TOKEN }}
          path: agent-software
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        working-directory: browser-control
        run: bun install

      - name: Typecheck
        working-directory: browser-control
        run: bun run typecheck

      - name: Test
        working-directory: browser-control
        run: bun test

  # Real Chrome for Testing + the unpacked extension against the local fixture page.
  # BC_E2E_REQUIRED=1 makes a missing browser or a skipped check fail the job instead of passing.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out browser-control
        uses: actions/checkout@v4
        with:
          path: browser-control
          persist-credentials: false
          # Full history: the stale-extension check archives the pre-PR #10 build.
          fetch-depth: 0

      # @agent-software/core resolves as file:../agent-software/core, a private sibling repo.
      - name: Check agent-software token
        env:
          TOKEN: ${{ secrets.AGENT_SOFTWARE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret AGENT_SOFTWARE_TOKEN is not set. Add a fine-grained, read-only (Contents) token for TheSethRose/agent-software."
            exit 1
          fi

      - name: Check out agent-software
        uses: actions/checkout@v4
        with:
          repository: TheSethRose/agent-software
          token: ${{ secrets.AGENT_SOFTWARE_TOKEN }}
          path: agent-software
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        working-directory: browser-control
        run: bun install

      # chrome@stable moves, so the cache key rolls weekly (ISO year-week) and on runner OS.
      - name: Cache key
        id: cft-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Chrome for Testing
        id: cft-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cft
          key: cft-${{ runner.os }}-chrome-stable-${{ steps.cft-week.outputs.week }}

      - name: Install Chrome for Testing
        if: steps.cft-cache.outputs.cache-hit != 'true'
        working-directory: browser-control
        run: bunx @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/cft"

      - name: Resolve Chrome for Testing binary
        run: |
          bin="$(find "$RUNNER_TEMP/cft" -type f -name chrome -path '*/chrome-linux64/chrome' | head -n 1)"
          if [ -z "$bin" ]; then
            echo "::error::Chrome for Testing not found under $RUNNER_TEMP/cft"
            find "$RUNNER_TEMP/cft" -maxdepth 3
            exit 1
          fi
          echo "Using $bin"
          {
            echo "BC_E2E_CHROME=$bin"
            echo "BC_E2E_REQUIRED=1"
            echo "BROWSER_CONTROL_BACKENDS=extension"
          } >> "$GITHUB_ENV"

      # Ubuntu 23.10+ restricts unprivileged user namespaces via AppArmor, which makes Chrome abort
      # with "No usable sandbox!". Re-enable them (and keep the setuid helper usable) instead of
      # running Chrome with --no-sandbox.
      - name: Prepare Chrome sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sandbox="$(dirname "$BC_E2E_CHROME")/chrome_sandbox"
          if [ -f "$sandbox" ]; then
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
          fi

      # Fail fast if Chrome cannot start at all; the e2e runner discards Chrome's stderr.
      - name: Probe Chrome launch
        run: |
          profile="$(mktemp -d)"
          "$BC_E2E_CHROME" --headless=new --use-mock-keychain --password-store=basic \
            --user-data-dir="$profile" --no-first-run --no-default-browser-check \
            --dump-dom about:blank > /dev/null

      - name: E2E
        working-directory: browser-control
        run: bun run test:e2e
