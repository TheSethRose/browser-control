<!doctype html><html><head><meta charset="utf-8"><title>E2E Form</title></head>
<body>
<h1>E2E Form</h1>
<form id="f" onsubmit="return false">
<p><label>Full name <input id="f-name" type="text"></label></p>
<p><label>Email address <input id="f-email" type="email"></label></p>
<p><label>Phone number <input id="f-phone" type="tel"></label></p>
<p><label>Company <input id="f-company" type="text"></label></p>
<p><label>Website <input id="f-site" type="url"></label></p>
<p><label>Start date <input id="f-date" type="date"></label></p>
<p><label>Country <select id="f-country"><option value="">Pick one</option><option value="ca">Canada</option><option value="us">United States</option></select></label></p>
<p><label>Notes <textarea id="f-notes"></textarea></label></p>
<p><label><input id="f-terms" type="checkbox"> Accept terms</label></p>
<p><label><input id="f-plan-a" type="radio" name="plan" value="basic"> Basic plan</label>
<label><input id="f-plan-b" type="radio" name="plan" value="pro"> Pro plan</label></p>
</form>
<img src="/slow.png" alt="" width="1" height="1">
</body></html>
