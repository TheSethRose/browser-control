<!doctype html><html><head><meta charset="utf-8"><title>Short Fixture</title></head>
<body><button id="target" type="button">Pacing target</button><script>window.__events=[];for(const t of ['mousedown','mousemove']){addEventListener(t,e=>window.__events.push([e.type,Math.round((performance.timeOrigin+performance.now())*10)/10,e.isTrusted,e.clientX,e.clientY,null,0,e.target.id||'']),{capture:true,passive:true});}</script></body></html>
