<!doctype html><html><head><meta charset="utf-8"><title>E2E Fixture</title></head>
<body>
<h1>E2E Fixture</h1>
<p><label>Handoff input <input id="handoff-input" type="text"></label></p>
<p><a href="#section" id="hash">Jump to section</a> <a href="/popup" target="_blank" id="pop">Open popup</a></p>
<div id="sh"></div>
<script>
  const root = document.getElementById("sh").attachShadow({ mode: "open" });
  root.innerHTML = '<button id="sbtn" type="button">Shadow button</button> <input id="sin" aria-label="Shadow input">';
  root.getElementById("sbtn").addEventListener("click", (e) => { e.target.textContent = "shadow clicked"; });
</script>
<label>Upload file <input type="file" id="up" onchange="document.getElementById('log').textContent='file '+this.files[0].name"></label>
<button id="al" type="button" onclick="alert('hello'); document.getElementById('log').textContent='alert closed'">Alert me</button>
<button id="cf" type="button" onclick="document.getElementById('log').textContent='confirm '+confirm('sure?')">Confirm me</button>
<div id="log">ready</div>
<iframe name="a" id="fa" src="__FRAME__" width="320" height="60"></iframe>
<iframe name="b" id="fb" src="__FRAME__" width="320" height="60"></iframe>
<div style="height:1500px"></div>
<h2 id="section">Section</h2>
</body></html>
